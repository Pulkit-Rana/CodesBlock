  </defs>
  <rect x="20" y="20" width="472" height="472" rx="110" ry="110" fill="url(#sqBg)"/>
  <rect x="22" y="22" width="468" height="468" rx="108" ry="108" fill="none" stroke="url(#sqRim)" stroke-width="4"/>
  <g filter="url(#softGlow)">
    <!-- White C Arc -->
    <path d="M 335,175 A 130,130 0 1,0 260,380" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round"/>
    <!-- Blue B Monogram -->
    <path d="M 230,220 H 315 C 345,220 365,235 365,265 C 365,285 350,300 330,305 C 355,310 372,328 372,355 C 372,388 348,405 315,405 H 230 Z" fill="url(#blueBGrad)"/>
