name: 🐛 Bug Report
description: Create a report to help us reproduce and fix an issue
title: "fix: [Short bug summary]"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in CodesBlock! Please provide as much context as possible.
  - type: textarea
    id: problem-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs-and-errors
    attributes:
      label: Relevant Logs / Console Output / Screenshots
      description: Attach error logs, browser console output, or screenshots if applicable.
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local Development (LocalWP)
        - Production Server
        - Staging / CI
    validations:
      required: true
