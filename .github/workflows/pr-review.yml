name: PR Review & Triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-labeler:
    name: Auto Triage & Size Labeling
    runs-on: ubuntu-latest
    steps:
      - name: Calculate PR Diff Size and Apply Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;

            let sizeLabel = 'size/XS';
            if (totalChanges > 1000) {
              sizeLabel = 'size/XL';
            } else if (totalChanges > 500) {
              sizeLabel = 'size/L';
            } else if (totalChanges > 200) {
              sizeLabel = 'size/M';
            } else if (totalChanges > 50) {
              sizeLabel = 'size/S';
            }

            const existingLabels = pr.labels.map(l => l.name);
            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            
            // Remove old size labels if different
            for (const label of sizeLabels) {
              if (label !== sizeLabel && existingLabels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                }).catch(() => {});
              }
            }

            // Add correct size label
            if (!existingLabels.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [sizeLabel]
              }).catch(e => console.log('Could not add label:', e));
            }

  pr-checklist-verification:
    name: PR Template & Checklist Verification
    runs-on: ubuntu-latest
    steps:
      - name: Audit PR Description Checklist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            const requiredSections = [
              { name: 'Summary / Description', pattern: /###?\s*(Summary|Description|Context)/i },
              { name: 'Security Verification', pattern: /###?\s*Security/i },
              { name: 'Testing / Verification', pattern: /###?\s*(Testing|Verification)/i }
            ];

            const missing = [];
            for (const sec of requiredSections) {
              if (!sec.pattern.test(body)) {
                missing.push(sec.name);
              }
            }

            if (missing.length > 0) {
              core.warning(`PR description is missing required company sections: ${missing.join(', ')}. Please use .github/PULL_REQUEST_TEMPLATE.md`);
            } else {
              core.info('PR template sections verified successfully.');
            }
