name: Security Checks

on:
  workflow_dispatch:
  push:
    branches: [main, prod_setup]
  pull_request:
    branches: [main, prod_setup]
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml

      - name: Custom High-Risk Credential Pattern Scan
        run: |
          echo "Scanning for high-risk hardcoded credential patterns..."
          SUSPECTS=$(git grep -I -i -E '(aws_secret_access_key|api_key[[:space:]]*=[[:space:]]*["\x27][0-9a-zA-Z]{16,}["\x27]|password[[:space:]]*=[[:space:]]*["\x27][^"\x27]{6,}["\x27]|bearer[[:space:]]+[a-zA-Z0-9_\-\.]{20,})' -- ':!tests' ':!.github' || true)
          if [ -n "$SUSPECTS" ]; then
            echo "::warning::Potential hardcoded secrets detected:"
            echo "$SUSPECTS"
          else
            echo "No obvious hardcoded credentials identified."
          fi

  sast-analysis:
    name: SAST Vulnerability Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'

      - name: Scan for OWASP Top 10 PHP Anti-Patterns
        run: |
          echo "Scanning for unsafe PHP anti-patterns (raw \$_GET/\$_POST without sanitization, unescaped echoes)..."
          php scripts/sast-scan.php

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover tracked dependency lockfiles
        id: dependencies
        run: |
          composer_count=$(git ls-files | awk '/(^|\/)composer\.lock$/ { count++ } END { print count + 0 }')
          npm_count=$(git ls-files | awk '/(^|\/)package-lock\.json$/ { count++ } END { print count + 0 }')
          echo "composer=$composer_count" >> "$GITHUB_OUTPUT"
          echo "npm=$npm_count" >> "$GITHUB_OUTPUT"

      - name: Setup PHP and Composer
        if: steps.dependencies.outputs.composer != '0'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Node.js
        if: steps.dependencies.outputs.npm != '0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Audit tracked Composer dependencies
        if: steps.dependencies.outputs.composer != '0'
        run: |
          while IFS= read -r lockfile; do
            composer --working-dir="$(dirname "$lockfile")" audit --locked --no-dev
          done < <(git ls-files | grep -E '(^|/)composer\.lock$')

      - name: Audit tracked npm dependencies
        if: steps.dependencies.outputs.npm != '0'
        run: |
          while IFS= read -r lockfile; do
            npm audit --audit-level=moderate --package-lock-only --prefix "$(dirname "$lockfile")"
          done < <(git ls-files | grep -E '(^|/)package-lock\.json$')

  wp-hardening-audit:
    name: WordPress Hardening & Privacy Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Exposed Sensitive Files in Web Root
        run: |
          echo "Verifying no database dumps or credentials in tracked web root..."
          EXPOSED=$(git ls-files | grep -v -E '(secondary-packages|vendor)' | grep -E '(^|/)(wp-admin|wp-includes)/|(^|/)wp-config\.php$|(^|/)wp-login\.php$|(^|/)\.envrc$|(^|/)(GEMINI\.md|SECURITY-REMEDIATION\.md)$|^output/security-20260912/|\.sql$|\.pem$|\.key$|id_rsa' || true)
          if [ -n "$EXPOSED" ]; then
            echo "::error::Critical sensitive file tracked in git repository:"
            echo "$EXPOSED"
            exit 1
          fi
          echo "No sensitive configuration or key files tracked."
