name: Essential Checks

on:
  workflow_dispatch:
  push:
    branches: [main, prod_setup]
  pull_request:
    branches: [main, prod_setup]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title-lint:
    name: Conventional Commits / PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          requireScope: false

  repo-hygiene:
    name: Repository Hygiene & Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Merge Conflict Markers
        run: |
          echo "Checking for unresolved git conflict markers..."
          CONFLICT_FILES=$(git grep -I -n -E '^(<{7}\s|={7}$|>{7}\s)' -- '*.php' 'template-parts/*' 'assets/*' 'tests/*' '.github/*' '*.js' '*.css' '*.json' '*.yml' '*.md' || true)
          if [ -n "$CONFLICT_FILES" ]; then
            echo "::error::Unresolved merge conflict markers detected:"
            echo "$CONFLICT_FILES"
            exit 1
          fi
          echo "No conflict markers detected."

      - name: Check for Forbidden Files and Private Keys
        run: |
          echo "Checking for accidental tracking of private, temp, or backup files..."
          FORBIDDEN_TRACKED=$(git ls-files | grep -v -E '(secondary-packages|vendor)' | grep -E '(wp-config\.php$|\.sql$|\.key$|id_rsa$|\.env$|\.env\..*)$' || true)
          if [ -n "$FORBIDDEN_TRACKED" ]; then
            echo "::error::Forbidden or private file patterns tracked in git:"
            echo "$FORBIDDEN_TRACKED"
            exit 1
          fi
          echo "No forbidden file patterns tracked in git."

      - name: Check for Excessive File Sizes (>10MB)
        run: |
          echo "Verifying no oversized binaries tracked in repository..."
          OVERSIZED=$(find . -path ./.git -prune -o -type f -size +10M -print)
          if [ -n "$OVERSIZED" ]; then
            echo "::warning::Large files detected (>10MB):"
            echo "$OVERSIZED"
          fi

      - name: Validate JSON and YAML Files
        run: |
          echo "Validating YAML and JSON formatting..."
          python3 -c "
          import json, glob, sys
          errors = 0
          for f in glob.glob('**/*.json', recursive=True):
              if 'node_modules' in f or 'vendor' in f: continue
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      json.load(fp)
              except Exception as e:
                  print(f'JSON error in {f}: {e}', file=sys.stderr)
                  errors += 1
          sys.exit(errors)
          "
          echo "JSON files validated successfully."
