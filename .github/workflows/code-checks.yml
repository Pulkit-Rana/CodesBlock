name: Code Checks

on:
  workflow_dispatch:
  push:
    branches: [main, prod_setup]
  pull_request:
    branches: [main, prod_setup]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Syntax & Linting (php -l)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Run PHP Syntax Check on Theme Files
        run: |
          echo "Linting PHP files in theme root..."
          ERRORS=0
          for file in *.php template-parts/*.php tests/*.php tests/**/*.php; do
            if [ -f "$file" ]; then
              php -l "$file" || ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "::error::PHP syntax errors found: $ERRORS"
            exit 1
          fi
          echo "All theme and test PHP files passed syntax check on PHP ${{ matrix.php-version }}."

  php-code-standards:
    name: WordPress PHP Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install WordPress Coding Standards
        run: |
          composer global config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --prefer-dist squizlabs/php_codesniffer:3.13.6 wp-coding-standards/wpcs:3.4.1

      - name: Collect changed first-party theme PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA^" 2>/dev/null || echo "$HEAD_SHA")
          fi
          git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '*.php' > changed-php-all.txt
          grep -E '^(archive-course|comments|footer|front-page|functions|header|inc|index|page[^/]*|single[^/]*)\.php$|^template-parts/.*\.php$|^tests/(unit|fixtures)/.*\.php$' changed-php-all.txt > changed-php.txt || true
          if [ ! -s changed-php.txt ]; then
            echo "No first-party theme PHP files changed; skipping PHPCS."
          else
            cat changed-php.txt
          fi

      - name: Run PHPCS with WordPress standards
        run: |
          if [ -s changed-php.txt ]; then
            PHPCS_BIN="$(composer global config bin-dir --absolute)/phpcs"
            "$PHPCS_BIN" --standard=WordPress --report=summary --file-list=changed-php.txt
          else
            echo "No theme PHP files to scan."
          fi

  frontend-checks:
    name: Frontend Assets & Script Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify JavaScript Syntax
        run: |
          echo "Validating JavaScript files syntax..."
          node -e '
          const fs = require("fs");
          const vm = require("vm");
          const glob = require("path");
          const jsFiles = ["assets/js/main.js", "assets/js/member.js", "assets/js/course-portal.js", "assets/js/course-learning.js"];
          let errors = 0;
          for (const file of jsFiles) {
            if (fs.existsSync(file)) {
              try {
                const code = fs.readFileSync(file, "utf8");
                new vm.Script(code);
                console.log(`[PASS] ${file}`);
              } catch (e) {
                console.error(`[FAIL] ${file}: ${e.message}`);
                errors++;
              }
            }
          }
          if (errors > 0) process.exit(1);
          '

  scripts-lint:
    name: Python & Shell Scripts Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and Lint Python Scripts
        run: |
          echo "Compiling Python scripts..."
          python3 -m py_compile Configure-SearXNG-Engines.py
          echo "Python scripts compiled successfully."

      - name: Check Shell Script Syntax
        run: |
          echo "Validating Bash scripts..."
          if [ -f "Run-SearXNG-Manually.sh" ]; then
            bash -n Run-SearXNG-Manually.sh
            echo "[PASS] Run-SearXNG-Manually.sh syntax OK"
          fi
