# Dependabot configuration for CodesBlock
version: 2

updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "area/ci"
      - "dependencies"

  # Theme npm packages (if applicable)
  - package-ecosystem: "npm"
    directory: "/app/public/wp-content/themes/twentytwentyfive"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "area/assets"
      - "dependencies"

  # Plugin Composer packages (knit-pay)
  - package-ecosystem: "composer"
    directory: "/app/public/wp-content/plugins/knit-pay"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "area/security"
      - "dependencies"
